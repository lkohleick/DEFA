[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defa"
version = "1.0.0"
description = "Domain-informed effector gene assignment framework for GWAS loci"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Leonhard Kohleick" }]
keywords = ["gwas", "gene-prioritization", "variant-annotation", "genomics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "easydict==1.13",
    "loguru==0.7.3",
    "networkx",
    "numpy==2.2.2",
    "pandas==2.2.3",
    "polars==1.21.0",
    "pyarrow==19.0.0",
    "pybedtools==0.12.1",
    "pyensembl==2.3.13",
    "pyliftover",
    "PyYAML==6.0.2",
    "scipy==1.15.1",
    "tqdm==4.67.1",
]

[project.urls]
Repository = "https://github.com/lkohleick/DEFA"
Issues = "https://github.com/lkohleick/DEFA/issues"

[project.optional-dependencies]

scoring = ["scikit-learn", "xgboost==3.3.0"]
dev = ["pytest", "pre-commit", "ruff", "scalene==1.5.51"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 200

[tool.ruff.lint]
# (unused imports, unused locals, undefined names)
select = ["E9", "F"]
