name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Needs no project dependencies at all, so it answers in seconds and tells you
  # whether the failure below is your code or the install.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check --output-format github

  # The install is the point of this job as much as the assertions are: it is the
  # step every new user hits first, and the only one you never exercise yourself.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Not "[dev]" alone: the full dependency set is what importing defa.main
      # actually needs, because it pulls in pybedtools and pyensembl.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import the package
        run: python -c "import defa.main"

      # The suite stubs every external data source, so no reference data and no
      # network beyond the package index.
      - name: Run tests
        run: pytest tests -q
